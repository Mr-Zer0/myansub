[package]
name = "myansub"
version = "0.1.0"
edition = "2024"

[lib]
name = "myansub"
path = "src/lib.rs"

[[bin]]
name = "myansub"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
encoding_rs = "0.8.44"
chardetng = "1.0.0"

[dev-dependencies]
tempfile = "3"
