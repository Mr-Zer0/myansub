[package]
name = "myansub"
version = "0.1.0"
edition = "2024"

[lib]
name = "myansub"
path = "src/lib.rs"

[[bin]]
name = "myansub"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
encoding_rs = "0.8.44"
chardetng = "1.0.0"
subtitler = { version = "2", default-features = false, features = [
    "srt",
    "vtt",
    "ass",
    "ssa",
    "sbv",
] }
rsubs-lib = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
sha2 = "0.10"

[features]
# Scripted `llm::fake` transport for tests. Enabled for this crate's own unit
# tests via `cfg(test)` and for the integration tests via the self
# dev-dependency below, so plain `cargo test` works without extra flags, while a
# production build (`cargo build`) excludes the test scaffolding.
testing = []

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# Enables `tokio::time::pause`/`start_paused` for deterministic delay tests
# (union of features is dev/test-only; production keeps the plain `tokio` above).
tokio = { version = "1.54.1", features = ["test-util"] }
# Self-dependency with `testing` enabled so integration tests (a separate crate)
# can use `llm::fake`. See ADR-027.
myansub = { path = ".", features = ["testing"] }
